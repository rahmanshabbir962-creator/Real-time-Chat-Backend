<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Converse</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<main id="auth-view" class="auth"><section class="card"><b class="logo">◈ Converse</b><p>REALTIME CHAT</p><h1>Conversations, happening now.</h1><form id="login-form"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form><button id="show-signup" class="link">Create an account</button><form id="signup-form" class="hide"><input name="display_name" placeholder="Display name" required><input name="username" placeholder="Username" required minlength="3"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (8+ characters)" required minlength="8"><button>Create account</button></form><small id="auth-error"></small></section></main>
<main id="chat-view" class="chat hide"><aside><header><b class="logo">◈ Converse</b><button id="new-room">+</button></header><section class="user"><span id="avatar"></span><b id="profile-name"></b><button id="logout">Sign out</button></section><div class="room-title">YOUR ROOMS <button id="refresh">Refresh</button></div><nav id="rooms"></nav><button id="browse" class="browse">Browse public rooms</button></aside><section class="content"><header id="room-header"><p>WELCOME</p><h2>Select a room to start chatting</h2></header><div id="messages" class="messages"><div class="empty">✦<h3>Your conversations live here</h3><p>Create a room or select one from the sidebar.</p></div></div><div id="typing"></div><form id="message-form" class="composer hide"><input id="message" placeholder="Write a message…" maxlength="5000"><button>↑</button></form></section></main>
<dialog id="create-dialog"><form id="room-form" method="dialog"><button value="cancel" class="close">×</button><p>NEW SPACE</p><h2>Create a room</h2><input name="name" placeholder="Room name" required><input name="description" placeholder="Description"><label><input name="is_private" type="checkbox"> Private room</label><button>Create room</button><small id="room-error"></small></form></dialog><dialog id="public-dialog"><section><button id="close-public" class="close">×</button><p>DISCOVER</p><h2>Public rooms</h2><div id="public-rooms"></div></section></dialog><div id="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/static/app.js"></script></body></html>
